# AI博客生成器配置文件示例
# 复制此文件为 config.yaml 并填入您的实际配置

# ===========================================
# SiliconFlow API 配置
# ===========================================
siliconflow:
  # 必需：您的 SiliconFlow API 密钥
  # 获取地址：https://siliconflow.cn/account/settings
  api_key: "your-api-key-here"

  # API 基础地址（通常无需修改）
  base_url: "https://api.siliconflow.cn/v1"

  # 文本生成模型（用于生成对话内容）
  chat_model: "deepseek-chat"

  # 语音合成模型
  tts_model: "speech-gh-chinese"

  # 图像生成模型（用于生成视频配图）
  image_model: "stabilityai/stable-diffusion-3-5-large"

# ===========================================
# 文本转语音 (TTS) 配置
# ===========================================
tts:
  # 音频输出格式（支持：mp3, wav, ogg）
  format: "mp3"

  # 主持人（S1）音色
  # 可选值取决于所选的 TTS 模型
  voice1: "alex"

  # 嘉宾（S2）音色
  # 可选值取决于所选的 TTS 模型
  voice2: "anna"

  # 语速控制（0.5 - 2.0，1.0为正常语速）
  speed: 1.0

  # 音频采样率
  sample_rate: 32000

# ===========================================
# 视频生成配置
# ===========================================
video:
  # 是否启用视频生成功能
  enabled: true

  # 支持的图片文件格式（用于自动识别）
  image_patterns:
    - "*.jpg"
    - "*.jpeg"
    - "*.png"
    - "*.bmp"
    - "*.webp"

  # 视频帧率（建议：24, 30, 60）
  fps: 24

  # 视频分辨率
  resolution: "1920x1080"

  # 是否循环图片（当图片数量少于音频段数时）
  loop_images: true

  # 图片显示时长（秒）
  # 如果为 0，则根据音频长度自动调整
  image_duration: 0

# ===========================================
# FFmpeg 配置
# ===========================================
ffmpeg:
  # FFmpeg 可执行文件路径
  # Windows: "ffmpeg.exe" 或 "C:\\path\\to\\ffmpeg.exe"
  # macOS/Linux: "ffmpeg" 或 "/usr/local/bin/ffmpeg"
  binary_path: "ffmpeg"

  # 默认音频输出格式
  output_format: "mp3"

  # 视频编码器（推荐：libx264, hevc, libvpx-vp9）
  video_codec: "libx264"

  # 音频编码器（推荐：aac, mp3, opus）
  audio_codec: "aac"

  # 视频质量（CRF值，0-51，值越小质量越高）
  video_quality: 23

  # 音频比特率（支持：128k, 192k, 256k, 320k）
  audio_bitrate: "192k"

# ===========================================
# 输出配置
# ===========================================
output:
  # 主输出目录
  dir: "./output"

  # 音频文件输出目录
  audio_dir: "./output/audio"

  # 视频文件输出目录
  video_dir: "./output/videos"

  # 文本文件输出目录
  text_dir: "./output/text"

  # 是否保留临时文件
  # true: 保留所有临时文件，便于调试
  # false: 清理临时文件，节省空间
  keep_temp_files: true

  # 是否使用会话文件夹
  # true: 每次生成创建独立文件夹（按时间戳命名）
  # false: 直接输出到指定目录
  session_folders: true

# ===========================================
# 日志配置
# ===========================================
log:
  # 日志级别（debug, info, warn, error）
  level: "info"

  # 日志输出文件（为空则输出到控制台）
  file: ""

  # 是否输出彩色日志
  color: true

# ===========================================
# 性能配置
# ===========================================
performance:
  # 并发处理的音频段数
  # 值越大处理越快，但占用资源越多
  audio_concurrency: 5

  # 图片生成时的并发数
  image_concurrency: 3

  # API 请求重试次数
  api_retry_count: 3

  # API 请求超时时间（秒）
  api_timeout: 60

# ===========================================
# 批量生成配置
# ===========================================
batch:
  # 默认批量生成数量
  default_count: 5

  # 最大批量生成数量（防止意外的大量请求）
  max_count: 20

  # 批量生成时的延迟间隔（秒）
  # 避免触发 API 频率限制
  delay_between_requests: 3

# ===========================================
# 预定义主题列表（用于批量生成）
# ===========================================
# 您可以修改这些主题，或在运行时通过命令行指定
topics:
  - "人工智能AGI的实现路径及其对人类文明的深远影响"
  - "量子计算突破：从实验室到产业化的机遇与挑战"
  - "基因编辑技术的伦理边界与未来医学革命"
  - "Web3.0与去中心化互联网：重塑数字经济的底层逻辑"
  - "碳中和背景下的能源革命：可再生能源与储能技术的创新"
  - "脑机接口：人机融合的科技前沿与哲学思考"
  - "太空经济：从商业航天到星际殖民的宏伟蓝图"
  - "元宇宙：虚拟现实与数字孪生的技术融合与商业模式"
  - "合成生物学：设计生命、创造未来的科技革命"
  - "区块链的第三次浪潮：DeFi、NFT与DAO的组织创新"

# ===========================================
# 高级配置
# ===========================================
advanced:
  # 对话生成提示词优化
  # true: 启用深度对话优化，生成更专业的内容
  # false: 使用基础提示词，生成速度更快
  deep_dialogue_optimization: true

  # 图片生成提示词优化
  # true: 生成 PPT 风格的专业图片
  # false: 生成通用风格图片
  ppt_style_images: true

  # 音频后处理
  # true: 对生成的音频进行降噪和音量标准化
  # false: 直接使用原始音频
  audio_post_processing: false